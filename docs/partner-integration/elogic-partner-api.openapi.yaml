openapi: 3.1.0
info:
  title: E-logic Partner API
  version: 1.0.0
  summary: The API the partner platform calls to read shared E-logic opportunities and files.
  description: |
    E-logic exposes the opportunities it has **explicitly shared** with the partner, and the files
    explicitly shared with them. Sharing is opt-in per opportunity on the E-logic side.

    **Flow.** A change is announced with a small signed webhook (`webhooks.elogicNotice`) and the
    receiver fetches the record. `GET /opportunities?changed_since=` is the catch-up if a notice was
    missed, withdrawn records included.

    **Authentication.** Every request needs `Authorization: Bearer <token>`. Any authentication
    failure returns a bare `401` with an empty body (a missing, wrong or revoked token, a disabled
    integration, or an invalid webhook signature or timestamp all look the same).

    **Webhook signing** (both directions): `X-Signature` is the lowercase hex HMAC-SHA256 of
    `{X-Timestamp}.{raw request body}` keyed with the shared signing secret. `X-Timestamp` is Unix
    time in seconds and must be within 5 minutes of the receiver's clock.

    The field list is **provisional** until the two sides agree it; see the integration guide.
servers:
  - url: https://{host}/rfq/api/partner
    description: E-logic production
    variables:
      host:
        default: app.e-logic.us
security:
  - bearerAuth: []
tags:
  - name: Opportunities
  - name: Files
  - name: Webhook
paths:
  /opportunities:
    get:
      tags: [Opportunities]
      operationId: listOpportunities
      summary: Shared opportunities changed after a timestamp
      description: |
        Returns shared opportunities changed after `changed_since`, **including withdrawn ones** as
        tombstones (`removed: true`), which are kept indefinitely. Ordered by change time then id, so
        paging is stable. For the next catch-up use the `server_time` of the last complete walk minus a
        few seconds: re-applying an unchanged record is harmless.
      parameters:
        - name: changed_since
          in: query
          description: ISO-8601 UTC timestamp. Defaults to the start of 1970 (everything).
          schema: { type: string, format: date-time }
          example: "2026-10-15T10:00:00Z"
        - name: cursor
          in: query
          description: Opaque value from the previous page's `next_cursor`.
          schema: { type: string }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: solicitation_number
          in: query
          description: |
            Alternative to the path form of the single-record endpoint, for numbers that contain a
            slash (web servers commonly reject an encoded slash in a path).
          schema: { type: string }
      responses:
        "200":
          description: One page of opportunities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityPage" }
        "400":
          description: Invalid `changed_since` or `cursor`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /opportunities/{solicitation_number}:
    get:
      tags: [Opportunities]
      operationId: getOpportunity
      summary: One opportunity with its shared files
      description: |
        The number is matched case-insensitively, ignoring surrounding and repeated spaces. A
        withdrawn opportunity returns `200` with `removed: true`; one that was never shared returns `404`.
      parameters:
        - name: solicitation_number
          in: path
          required: true
          schema: { type: string }
          example: FA8307-26-Q-0021
      responses:
        "200":
          description: The opportunity, or its withdrawal tombstone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityOrTombstone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /files/{file_id}:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: Download a shared file
      description: |
        Only files explicitly shared on a shared opportunity can be downloaded. A file that is not
        shared, was generated by E-logic (internal proposals, checklists, reports) or does not exist all
        answer `404`. Verify the bytes against `sha256` from the opportunity's `files`.
      parameters:
        - name: file_id
          in: path
          required: true
          schema: { type: integer }
          example: 383
      responses:
        "200":
          description: The raw file.
          headers:
            Content-Disposition:
              description: '`attachment; filename*=UTF-8''<name>`'
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /webhook:
    post:
      tags: [Webhook]
      operationId: receiveNotice
      summary: Tell E-logic a record changed
      description: |
        A light notice. `opportunity.removed` makes E-logic detach the link (no fetch needed). Any other
        event makes E-logic fetch the record from the partner API and apply it. Requires the bearer token
        **and** a valid `X-Timestamp` / `X-Signature`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartnerNotice" }
      responses:
        "200":
          description: Processed. `outcome` says what happened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticeResult" }
        "400":
          description: Malformed notice.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: E-logic could not fetch the record from the partner API. Retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
webhooks:
  elogicNotice:
    post:
      tags: [Webhook]
      operationId: elogicNotice
      summary: E-logic notifies you that a shared record changed
      description: |
        Sent to the partner's webhook URL. Answer with any `2xx` within 10 seconds. Delivery is
        at-least-once (handle repeats idempotently). Failures are retried after 1 minute, 5 minutes,
        30 minutes, 2 hours and 12 hours, then parked as failed; an E-logic administrator can re-send it.
        A newer notice for the same opportunity replaces one still waiting, so always fetch current state.
      parameters:
        - $ref: "#/components/parameters/Event"
        - $ref: "#/components/parameters/Timestamp"
        - $ref: "#/components/parameters/Signature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ElogicNotice" }
      responses:
        "200":
          description: Accepted. Any 2xx counts as delivered.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The token issued to the partner by an E-logic administrator (shown once, stored hashed).
  parameters:
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Current Unix time in seconds. Reject values more than 5 minutes from your clock.
      schema: { type: string, pattern: "^[0-9]+$" }
      example: "1792064737"
    Signature:
      name: X-Signature
      in: header
      required: true
      description: Lowercase hex HMAC-SHA256 of `{X-Timestamp}.{raw request body}` keyed with the shared secret.
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    Event:
      name: X-Event
      in: header
      required: true
      description: The event name, repeated from the body for routing.
      schema: { $ref: "#/components/schemas/ElogicEvent" }
  responses:
    Unauthorized:
      description: |
        Missing, wrong or revoked token; integration disabled; or invalid signature or timestamp.
        The body is always empty.
    NotFound:
      description: Unknown, or not shared. The two are indistinguishable by design.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Status:
      type: string
      description: |
        E-logic pipeline status. Fulfillment and invoicing are internal and are reported as `award`.
      enum:
        - tbd
        - working_on_it
        - bid
        - no_bid
        - submitted
        - submitted_ss
        - award
        - no_award_pricing
        - no_award_technical
        - cancelled
        - not_submitted
    SharedFile:
      type: object
      required: [id, name, size, sha256, updated_at, download_url]
      properties:
        id: { type: integer, example: 383 }
        name: { type: string, example: Statement_of_Work.docx }
        size: { type: integer, description: Bytes., example: 212331 }
        sha256: { type: string, description: Hex SHA-256 of the file., pattern: "^[0-9a-f]{64}$" }
        updated_at: { type: [string, "null"], format: date-time }
        download_url: { type: string, format: uri, description: Authenticated; use the same bearer token. }
    Opportunity:
      type: object
      required: [solicitation_number, elogic_id, removed, shared_updated_at, files]
      properties:
        solicitation_number: { type: string, example: FA8307-26-Q-0021 }
        elogic_id: { type: integer, description: E-logic's stable id for the record., example: 118063 }
        name: { type: [string, "null"] }
        agency: { type: [string, "null"], description: Shown as Client in E-logic. }
        issue_date:
          type: [string, "null"]
          format: date
        end_date:
          type: [string, "null"]
          description: ISO-8601 UTC timestamp, or a plain date when no time was entered.
        status: { $ref: "#/components/schemas/Status" }
        assignee_email: { type: [string, "null"] }
        shared_updated_at:
          type: [string, "null"]
          format: date-time
          description: |
            UTC time of the last save of the shared fields. Decides conflicts (latest wins). Null only
            for a record that has been shared but not yet processed by E-logic's change detection.
        removed: { type: boolean, const: false }
        files:
          type: array
          items: { $ref: "#/components/schemas/SharedFile" }
    Tombstone:
      type: object
      description: A withdrawn opportunity (sharing stopped or the quote deleted). Kept indefinitely.
      required: [elogic_id, solicitation_number, removed, shared_updated_at, files]
      properties:
        elogic_id: { type: integer }
        solicitation_number: { type: [string, "null"] }
        removed: { type: boolean, const: true }
        shared_updated_at: { type: string, format: date-time, description: When it was withdrawn. }
        files:
          type: array
          maxItems: 0
          items: {}
    OpportunityOrTombstone:
      oneOf:
        - $ref: "#/components/schemas/Opportunity"
        - $ref: "#/components/schemas/Tombstone"
    OpportunityPage:
      type: object
      required: [data, next_cursor, server_time]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/OpportunityOrTombstone" }
        next_cursor: { type: [string, "null"], description: Null on the last page. }
        server_time: { type: string, format: date-time }
    PartnerNotice:
      type: object
      required: [event]
      properties:
        event:
          type: string
          description: "`opportunity.removed` detaches the link; any other value triggers a fetch."
          examples: [opportunity.updated, opportunity.removed, document.shared, document.removed]
        record_id: { type: string, description: The partner's internal record id., example: P-1042 }
        solicitation_number: { type: string, example: FA8307-26-Q-0021 }
        occurred_at: { type: string, format: date-time }
    NoticeResult:
      type: object
      required: [ok, outcome]
      properties:
        ok: { type: boolean }
        outcome:
          type: string
          enum:
            - created
            - linked
            - updated
            - ignored_stale
            - ignored_deleted
            - ignored_unshared
            - ignored_unknown
            - review
            - rejected
            - hidden
            - detached
    ElogicEvent:
      type: string
      enum:
        - opportunity.updated
        - opportunity.removed
        - document.shared
        - document.removed
    ElogicNotice:
      type: object
      required: [event, elogic_id, solicitation_number, occurred_at]
      properties:
        event: { $ref: "#/components/schemas/ElogicEvent" }
        elogic_id: { type: integer, example: 118063 }
        solicitation_number: { type: [string, "null"] }
        record_id:
          type: [string, "null"]
          description: The partner's record id once the opportunity is linked; null before that.
        occurred_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string, example: not_found }
